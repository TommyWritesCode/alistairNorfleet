<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Art by Alistair Norfleet — A gallery of paintings, drawings, and mixed media works.">
  <title>Art — Alistair Norfleet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Particle canvas — fullscreen fixed backdrop */
    #particleCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Ambient particle layer -->
  <canvas id="particleCanvas" aria-hidden="true"></canvas>

  <!-- ── HEADER ────────────────────────────────────────────── -->
  <header class="site-header" role="banner">
    <a href="index.html" class="header-logo" aria-label="Alistair Norfleet — Home">AN</a>
    <nav class="header-nav" aria-label="Main navigation">
      <a href="projects.html" class="nav-link">Projects</a>
      <a href="art.html"      class="nav-link active">Art</a>
      <a href="about.html"    class="nav-link">About</a>
    </nav>
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="projects.html" class="nav-link">Projects</a>
    <a href="art.html"      class="nav-link">Art</a>
    <a href="about.html"    class="nav-link">About</a>
  </nav>

  <!-- ── ART PAGE ──────────────────────────────────────────── -->
  <div class="art-bg" aria-hidden="true"></div>

  <div class="art-page">
    <div class="art-page-content">

      <header class="gallery-header">
        <h1>Works</h1>
        <p>A collection of paintings, drawings, and mixed media — arranged by year</p>
      </header>

      <main aria-label="Art gallery">
        <div class="gallery-grid" id="galleryGrid" role="list">
          <!-- Populated by art.js -->
        </div>
      </main>

    </div>
  </div>

  <!-- ── LIGHTBOX ──────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork detail">
    <button class="lightbox-close" aria-label="Close artwork view">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>

    <div class="lightbox-inner">
      <div class="lightbox-art-wrap">
        <img class="lightbox-art-img" id="lbImg" src="" alt="" loading="lazy">
        <div class="lightbox-art-placeholder" id="lbPlaceholder" style="display:none" aria-hidden="true"></div>
      </div>

      <div class="lightbox-info">
        <div class="lightbox-year"  id="lbYear"></div>
        <h2 class="lightbox-title"  id="lbTitle"></h2>
        <p class="lightbox-medium"  id="lbMedium"></p>
        <p class="lightbox-dims"    id="lbDims"></p>
        <p class="lightbox-desc"    id="lbDesc"></p>
        <div class="lightbox-nav">
          <button class="lightbox-nav-btn" id="lbPrev" aria-label="Previous artwork">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/>
            </svg>
          </button>
          <button class="lightbox-nav-btn" id="lbNext" aria-label="Next artwork">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── FOOTER ────────────────────────────────────────────── -->
  <footer class="site-footer" role="contentinfo" style="position:relative;z-index:1"></footer>

  <script src="js/main.js"></script>
  <script src="js/art.js"></script>
</body>
</html>
