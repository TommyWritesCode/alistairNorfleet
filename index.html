<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alistair Norfleet — Philosopher and artist. Essays on consciousness, ethics, technology, and language.">
  <meta property="og:title" content="Alistair Norfleet">
  <meta property="og:description" content="Philosophy, art, and the examined life.">
  <meta property="og:type" content="website">
  <title>Alistair Norfleet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ── HEADER ────────────────────────────────────────────── -->
  <header class="site-header" role="banner">
    <a href="index.html" class="header-logo" aria-label="Alistair Norfleet — Home">AN</a>
    <nav class="header-nav" aria-label="Main navigation">
      <a href="projects.html" class="nav-link">Projects</a>
      <a href="art.html"      class="nav-link">Art</a>
      <a href="about.html"    class="nav-link">About</a>
    </nav>
    <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- Mobile nav overlay -->
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="projects.html" class="nav-link">Projects</a>
    <a href="art.html"      class="nav-link">Art</a>
    <a href="about.html"    class="nav-link">About</a>
  </nav>

  <!-- ── HERO ──────────────────────────────────────────────── -->
  <main class="landing-hero page-enter" role="main">

    <!-- Left: art scroll -->
    <aside class="art-scroll-col" aria-label="Art portfolio preview" aria-hidden="true">
      <div class="art-scroll-track">
        <div class="art-scroll-inner" id="artScrollInner"></div>
      </div>
    </aside>

    <!-- Center: identity + essay peek -->
    <section class="landing-center" aria-label="Introduction">

      <p class="greeting-text" id="greetingText" aria-live="polite">&nbsp;</p>

      <div class="hero-headshot-wrap">
        <img
          src="assets/images/headshot.jpg"
          alt="Portrait of Alistair Norfleet"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
        >
        <div class="headshot-placeholder" style="display:none" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
            <circle cx="40" cy="28" r="18" fill="none" stroke="#3d4f64" stroke-width="1.5"/>
            <path d="M10 72 Q10 50 40 50 Q70 50 70 72" fill="none" stroke="#3d4f64" stroke-width="1.5"/>
          </svg>
        </div>
      </div>

      <h1 class="hero-name">I'm Alistair</h1>
      <p class="hero-tagline">And this is my work</p>

      <!-- Essay peek -->
      <div class="essay-peek-wrap" role="link" tabindex="0"
           aria-label="Read the latest essay — click to open">
        <div class="essay-peek-scroll-hint" aria-hidden="true">Latest essay</div>
        <div class="essay-peek-card">
          <div class="peek-label">Most Recent</div>
          <div class="peek-title" id="peekTitle">Loading…</div>
          <div class="peek-meta" id="peekMeta"></div>
          <p class="peek-body" id="peekBody"></p>
        </div>
      </div>

    </section>

    <!-- Right: bibliography -->
    <aside class="landing-biblio" aria-label="Essay bibliography">
      <div class="biblio-header">Selected Works</div>
      <div id="bibliographyList" aria-live="polite">
        <div style="display:flex;align-items:center;gap:10px;padding:20px 0">
          <div class="spinner"></div>
        </div>
      </div>
    </aside>

  </main>

  <!-- ── FOOTER ────────────────────────────────────────────── -->
  <footer class="site-footer" role="contentinfo"></footer>

  <script src="js/main.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
